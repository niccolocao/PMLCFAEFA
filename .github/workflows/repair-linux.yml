name: Package and verify Julia in-process R interface (Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-linux.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Download previously compiled Julia library
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/PMLCFAEFA_0.1.1.tar.gz \
            https://github.com/niccolocao/PMLCFAEFA/releases/download/v0.1.1/PMLCFAEFA_0.1.1.tar.gz
          mkdir -p /tmp/pml-inprocess
          tar -xzf /tmp/PMLCFAEFA_0.1.1.tar.gz -C /tmp/pml-inprocess
      - name: Build R archive with in-process Julia
        run: |
          set -euo pipefail
          pkg=/tmp/pml-inprocess/PMLCFAEFA
          cp Rpkg/DESCRIPTION Rpkg/NAMESPACE "$pkg/"
          cp Rpkg/R/PMLcfaefa.R "$pkg/R/"
          cp Rpkg/src/* "$pkg/src/"
          cp Rpkg/man/* "$pkg/man/"
          rm -f "$pkg/R/isolated.R" "$pkg/inst/julia/bin/pmlr-runner"
          grep '^Version: 0.1.2$' "$pkg/DESCRIPTION"
          cd /tmp/pml-inprocess
          tar -czf "$GITHUB_WORKSPACE/PMLCFAEFA_0.1.2.tar.gz" PMLCFAEFA
      - name: Install package
        run: R CMD INSTALL PMLCFAEFA_0.1.2.tar.gz
      - name: Run actual model in R process
        run: Rscript scripts/smoke.R
      - name: Upload tested archive
        uses: actions/upload-artifact@v4
        with:
          name: PMLCFAEFA-linux-inprocess
          path: PMLCFAEFA_0.1.2.tar.gz
      - name: Publish GitHub Release after successful model fit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.2 >/dev/null 2>&1 || \
            gh release create v0.1.2 --target "$GITHUB_SHA" \
              --title "PMLCFAEFA 0.1.2 Linux (in-process)" \
              --notes "Julia runs directly inside the R process. WARNING: Native faults can terminate R or RStudio. Experimental: numerical equivalence is not yet validated."
          gh release upload v0.1.2 PMLCFAEFA_0.1.2.tar.gz --clobber

name: Build Julia library and R package (Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Build bundled library and R package
        run: bash ./scripts/build-linux.sh
      - name: Install package without invoking Julia
        run: R CMD INSTALL PMLCFAEFA_0.1.0.tar.gz
      - name: Check that R can load the native Julia runtime
        run: Rscript scripts/smoke.R
      - name: Upload installable archive
        uses: actions/upload-artifact@v4
        with:
          name: PMLCFAEFA-linux-r-package
          path: PMLCFAEFA_0.1.0.tar.gz
      - name: Publish Linux archive on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 >/dev/null 2>&1 || gh release create v0.1.0 --target "$GITHUB_SHA" --title "PMLCFAEFA 0.1.0 (Linux)" --notes "Experimental, Linux-only R package with bundled Julia runtime. Numerical equivalence is not yet validated."
          gh release upload v0.1.0 PMLCFAEFA_0.1.0.tar.gz --clobber

name: Build Julia library and R package (Linux)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Build bundled library and R package
        run: bash ./scripts/build-linux.sh
      - name: Install package without invoking Julia
        run: R CMD INSTALL PMLCFAEFA_0.1.0.tar.gz
      - name: Check that R can load the native Julia runtime
        run: Rscript scripts/smoke.R
      - name: Upload installable archive
        uses: actions/upload-artifact@v4
        with:
          name: PMLCFAEFA-linux-r-package
          path: PMLCFAEFA_0.1.0.tar.gz
